services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fileuploads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fileuploads}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host port 5433 avoids a clash with a standalone PostgreSQL already on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileuploads} -d ${POSTGRES_DB:-fileuploads}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # `docker compose up --build` builds locally; `docker compose pull api` fetches the image CI publishes.
    image: ghcr.io/akash9891/azure-file-uploads:latest
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-fileuploads};Username=${POSTGRES_USER:-fileuploads};Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
      AzureStorage__AccountName: ${AZURE_STORAGE_ACCOUNT:-fileuploads47akash}
      AzureStorage__ContainerName: ${AZURE_STORAGE_CONTAINER:-uploads}
      # Service principal read by DefaultAzureCredential (EnvironmentCredential); the container has no Azure CLI login.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?Set AZURE_TENANT_ID in .env}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?Set AZURE_CLIENT_ID in .env}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?Set AZURE_CLIENT_SECRET in .env}

volumes:
  pgdata:
